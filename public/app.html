<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mercadinho do João</title>
  <link rel="preload" href="/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/style.css" />
  <script src="/js/theme.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Menu principal">
      <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-store" /></svg></span>
        <span class="brand-text"><strong>Mercadinho</strong><small>do João</small></span>
      </div>

      <nav id="tabs" class="nav">
        <span class="nav-indicator" id="nav-indicator" aria-hidden="true"></span>
        <p class="nav-section">Operação</p>
        <button data-tab="dashboard" class="tab-btn active" title="Painel"><svg class="icon"><use href="#i-layout-dashboard" /></svg><span>Painel</span></button>
        <button data-tab="vendas" class="tab-btn" title="Vendas"><svg class="icon"><use href="#i-shopping-cart" /></svg><span>Vendas</span></button>
        <button data-tab="produtos" class="tab-btn" title="Produtos"><svg class="icon"><use href="#i-package" /></svg><span>Produtos</span></button>
        <p class="nav-section" data-perm="manage">Gestão</p>
        <button data-tab="estoque" class="tab-btn" title="Estoque" data-perm="stock"><svg class="icon"><use href="#i-warehouse" /></svg><span>Estoque</span></button>
        <button data-tab="importar" class="tab-btn" title="Importar" data-perm="prices"><svg class="icon"><use href="#i-file-up" /></svg><span>Importar</span></button>
        <button data-tab="relatorios" class="tab-btn" title="Relatórios" data-perm="reports"><svg class="icon"><use href="#i-chart-column" /></svg><span>Relatórios</span></button>
        <button data-tab="usuarios" class="tab-btn" title="Usuários" data-admin-only><svg class="icon"><use href="#i-users" /></svg><span>Usuários</span></button>
      </nav>

      <div class="sidebar-foot">
        <button id="sidebar-toggle" class="tab-btn" type="button" title="Recolher menu" aria-expanded="true">
          <svg class="icon collapse-icon-close"><use href="#i-panel-left-close" /></svg>
          <svg class="icon collapse-icon-open"><use href="#i-panel-left-open" /></svg>
          <span>Recolher menu</span>
        </button>
      </div>
    </aside>
    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <div class="main">
      <header class="topbar" id="topbar">
        <button id="menu-btn" class="icon-btn mobile-only" type="button" aria-label="Abrir menu"><svg class="icon"><use href="#i-menu" /></svg></button>
        <div class="topbar-title" id="topbar-title">
          <h1 id="page-title">Painel</h1>
          <p id="page-subtitle"></p>
        </div>
        <div class="topbar-actions">
          <button id="theme-toggle" class="icon-btn theme-toggle" type="button" aria-label="Alternar tema claro/escuro" title="Alternar tema">
            <svg class="icon icon-moon"><use href="#i-moon" /></svg>
            <svg class="icon icon-sun"><use href="#i-sun" /></svg>
          </button>
          <div class="user-chip">
            <span id="user-avatar" class="user-avatar" aria-hidden="true"></span>
            <span class="user-meta"><strong id="user-name"></strong><small id="user-role"></small></span>
          </div>
          <button id="logout-btn" class="icon-btn" type="button" aria-label="Sair" title="Sair"><svg class="icon"><use href="#i-log-out" /></svg></button>
        </div>
      </header>

      <main id="content" class="content"></main>
    </div>
  </div>
  <div id="toasts" class="toast-stack" aria-live="polite"></div>

  <template id="tpl-dashboard">
    <section>
      <div class="kpi-grid" id="kpi-grid">
        <div class="kpi is-loading"><div class="kpi-top"><div class="skeleton skeleton-line w-40"></div><span class="kpi-icon"></span></div><div class="skeleton skeleton-value"></div><div class="skeleton skeleton-line w-60"></div></div>
        <div class="kpi is-loading"><div class="kpi-top"><div class="skeleton skeleton-line w-40"></div><span class="kpi-icon"></span></div><div class="skeleton skeleton-value"></div><div class="skeleton skeleton-line w-60"></div></div>
        <div class="kpi is-loading"><div class="kpi-top"><div class="skeleton skeleton-line w-40"></div><span class="kpi-icon"></span></div><div class="skeleton skeleton-value"></div><div class="skeleton skeleton-line w-60"></div></div>
        <div class="kpi is-loading"><div class="kpi-top"><div class="skeleton skeleton-line w-40"></div><span class="kpi-icon"></span></div><div class="skeleton skeleton-value"></div><div class="skeleton skeleton-line w-60"></div></div>
      </div>

      <div class="card reveal" id="card-price-pending" data-perm="prices" data-tone="warn">
        <div class="card-head">
          <span class="card-icon"><svg class="icon"><use href="#i-circle-alert" /></svg></span>
          <div><h3>Aguardando preço</h3><p class="muted">Cadastrados pelo estoque. Defina o preço de custo e de venda para liberar no caixa.</p></div>
          <span class="count-pill" id="count-price-pending">0</span>
        </div>
        <ul class="item-list" id="tb-price-pending"></ul>
      </div>

      <div class="dash-grid" id="admin-charts" data-perm="reports">
        <div class="card reveal">
          <div class="card-head">
            <span class="card-icon"><svg class="icon"><use href="#i-trending-up" /></svg></span>
            <div><h3>Vendas dos últimos 14 dias</h3><p class="muted" id="chart-sales-caption">Carregando…</p></div>
            <span class="chip positive" id="chart-sales-total">—</span>
          </div>
          <div id="chart-sales" class="chart"><div class="skeleton skeleton-block"></div></div>
        </div>
        <div class="card reveal">
          <div class="card-head" data-tone="warn">
            <span class="card-icon"><svg class="icon"><use href="#i-sparkles" /></svg></span>
            <div><h3>Mais vendidos no mês</h3><p class="muted">Por receita</p></div>
          </div>
          <div id="chart-top" class="bars"></div>
        </div>
      </div>

      <div class="dash-grid three">
        <div class="card reveal" data-tone="danger">
          <div class="card-head">
            <span class="card-icon"><svg class="icon"><use href="#i-triangle-alert" /></svg></span>
            <div><h3>Estoque baixo</h3><p class="muted">Abaixo do mínimo</p></div>
            <span class="count-pill" id="count-low-stock">0</span>
          </div>
          <ul class="item-list" id="tb-low-stock"></ul>
        </div>
        <div class="card reveal" data-tone="warn">
          <div class="card-head">
            <span class="card-icon"><svg class="icon"><use href="#i-hourglass" /></svg></span>
            <div><h3>Vai acabar em 7 dias</h3><p class="muted">Pelo ritmo de vendas</p></div>
            <span class="count-pill" id="count-soon-out">0</span>
          </div>
          <ul class="item-list" id="tb-soon-out"></ul>
        </div>
        <div class="card reveal" data-tone="info">
          <div class="card-head">
            <span class="card-icon"><svg class="icon"><use href="#i-calendar" /></svg></span>
            <div><h3>Vencendo em breve</h3><p class="muted">Confira a validade</p></div>
            <span class="count-pill" id="count-expiring">0</span>
          </div>
          <ul class="item-list" id="tb-expiring"></ul>
        </div>
      </div>

      <div class="card reveal" id="card-slow-moving" data-perm="reports">
        <div class="card-head">
          <span class="card-icon"><svg class="icon"><use href="#i-package-x" /></svg></span>
          <div><h3>Produtos parados</h3><p class="muted">Sem venda nos últimos 60 dias</p></div>
          <span class="count-pill" id="count-slow-moving">0</span>
        </div>
        <ul class="item-list" id="tb-slow-moving"></ul>
      </div>
    </section>
  </template>

  <template id="tpl-vendas">
    <section>
      <div class="pos-grid">
        <div class="card pos-main reveal">
          <div class="sale-picker">
            <div class="search-field">
              <svg class="icon"><use href="#i-scan-barcode" /></svg>
              <input id="sale-search" type="text" autocomplete="off" placeholder="Buscar produto pelo nome…" aria-label="Buscar produto para adicionar à venda" />
              <kbd>Enter</kbd>
            </div>
            <div id="sale-results" class="search-results" role="listbox"></div>
          </div>

          <div class="cart-head">
            <h3>Itens da venda</h3>
            <span class="count-pill" id="cart-count">0</span>
          </div>
          <div class="table-wrap" id="cart-table-wrap" hidden><table class="table cart-table">
            <thead><tr><th>Produto</th><th>Quantidade</th><th>Preço</th><th>Subtotal</th><th></th></tr></thead>
            <tbody id="cart-body"></tbody>
          </table></div>
          <div id="cart-empty" class="cart-empty"></div>
        </div>

        <aside class="card pos-summary reveal">
          <h3>Resumo da venda</h3>
          <dl class="summary-lines">
            <div><dt>Produtos</dt><dd id="cart-lines">0</dd></div>
            <div><dt>Unidades</dt><dd id="cart-units">0</dd></div>
          </dl>
          <div class="summary-total">
            <span>Total a receber</span>
            <strong id="cart-total">R$ 0,00</strong>
          </div>
          <button id="confirm-sale-btn" class="btn-lg btn-block" type="button" disabled>
            <svg class="icon"><use href="#i-check" /></svg><span id="confirm-sale-label">Confirmar venda</span>
          </button>
          <p id="sale-msg" class="error" hidden></p>
          <p class="summary-hint">Use ↑ ↓ para escolher na busca e Enter para adicionar.</p>
        </aside>
      </div>

      <div class="card reveal">
        <div class="card-head">
          <span class="card-icon"><svg class="icon"><use href="#i-receipt" /></svg></span>
          <div><h3>Vendas recentes</h3><p class="muted">As 15 últimas registradas</p></div>
        </div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Data</th><th>Vendedor</th><th>Itens</th><th>Total</th><th></th></tr></thead>
          <tbody id="sales-list"></tbody>
        </table></div>
      </div>
    </section>
  </template>

  <template id="tpl-produtos">
    <section>
      <div class="toolbar">
        <div class="search-field"><svg class="icon"><use href="#i-search" /></svg><input id="product-search" type="text" autocomplete="off" placeholder="Buscar produtos pelo nome…" aria-label="Buscar produtos" /></div>
        <div class="segmented" id="product-filter" role="group" aria-label="Filtrar produtos">
          <button type="button" class="active" data-filter="all">Todos</button>
          <button type="button" data-filter="low">Estoque baixo</button>
          <button type="button" data-filter="pending" data-perm="catalog">Aguardando preço</button>
        </div>
        <button id="new-product-btn" class="push-right" type="button" data-perm="catalog"><svg class="icon"><use href="#i-plus" /></svg>Novo produto</button>
      </div>
      <div class="card reveal">
        <div class="card-head">
          <span class="card-icon"><svg class="icon"><use href="#i-package" /></svg></span>
          <div><h3>Catálogo</h3><p class="muted" id="products-caption">Carregando…</p></div>
        </div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Produto</th><th>Categoria</th><th>Estoque</th><th>Mín.</th><th>Preço</th><th data-perm="prices">Custo</th><th>Validade</th><th></th></tr></thead>
          <tbody id="products-list"></tbody>
        </table></div>
        <div id="products-pager" class="pager" hidden></div>
      </div>
    </section>
  </template>

  <template id="tpl-product-form">
    <form id="product-form" class="card" novalidate>
      <div class="modal-head">
        <span class="card-icon"><svg class="icon"><use href="#i-package" /></svg></span>
        <div><h3 id="product-form-title">Novo produto</h3><p class="muted" id="product-form-sub">Preencha os dados do produto.</p></div>
        <button type="button" class="icon-btn modal-close" id="product-close-btn" aria-label="Fechar"><svg class="icon"><use href="#i-x" /></svg></button>
      </div>
      <input type="hidden" id="p-id" />
      <div class="form-grid">
        <div class="span-2"><label for="p-name">Nome</label><input id="p-name" required maxlength="150" placeholder="Ex: Arroz Branco 5kg" /></div>
        <div><label for="p-category">Categoria</label><input id="p-category" maxlength="80" placeholder="Ex: Mercearia" list="p-category-list" /><datalist id="p-category-list"></datalist></div>
        <div><label for="p-barcode">Código de barras <span class="muted">(opcional)</span></label><input id="p-barcode" maxlength="64" inputmode="numeric" /></div>
        <p class="span-2 hint" data-perm-hide="prices">O preço de custo e de venda é definido pelo dono ou pelo financeiro. Até lá o produto fica "aguardando preço" e não aparece no caixa.</p>
        <div data-perm="prices"><label for="p-sale-price">Preço de venda</label><div class="input-prefix"><span>R$</span><input id="p-sale-price" type="number" step="0.01" min="0.01" required /></div></div>
        <div data-perm="prices"><label for="p-cost-price">Preço de custo</label><div class="input-prefix"><span>R$</span><input id="p-cost-price" type="number" step="0.01" min="0" required /></div></div>
        <div class="span-2" data-perm="prices"><div class="margin-preview" id="p-margin"><span>Margem por unidade</span><strong>—</strong></div></div>
        <div><label for="p-unit">Unidade</label><input id="p-unit" value="UN" maxlength="10" required /></div>
        <div><label for="p-expiry">Validade <span class="muted">(opcional)</span></label><input id="p-expiry" type="date" /></div>
        <div><label for="p-min-stock">Estoque mínimo</label><input id="p-min-stock" type="number" step="0.001" min="0" value="0" /><span class="hint">Abaixo disso o produto entra nos alertas.</span></div>
        <div id="p-initial-stock-field"><label id="p-initial-stock-label" for="p-initial-stock">Estoque inicial</label><input id="p-initial-stock" type="number" step="0.001" min="0" value="0" /><span class="hint">Entra no histórico como primeira entrada.</span></div>
      </div>
      <p id="product-form-msg" class="error" hidden></p>
      <div class="form-actions">
        <button type="submit" id="product-save-btn"><svg class="icon"><use href="#i-check" /></svg>Salvar</button>
        <button type="button" id="product-cancel-btn" class="secondary">Cancelar</button>
        <button type="button" id="product-delete-btn" class="danger" hidden>Desativar produto</button>
      </div>
    </form>
  </template>

  <template id="tpl-estoque">
    <section>
      <div class="grid-2">
        <form id="entry-form" class="card reveal" novalidate>
          <div class="card-head">
            <span class="card-icon"><svg class="icon"><use href="#i-arrow-down-to-line" /></svg></span>
            <div><h3>Entrada de mercadoria</h3><p class="muted">Compra ou reposição de fornecedor</p></div>
          </div>
          <label for="entry-product">Produto</label>
          <select id="entry-product" required></select>
          <div class="stock-hint" id="entry-hint"></div>
          <label for="entry-qty">Quantidade que chegou</label><input id="entry-qty" type="number" step="0.001" min="0.001" required />
          <label for="entry-reason">Observação <span class="muted">(opcional)</span></label><input id="entry-reason" maxlength="255" placeholder="Ex: nota 1234, fornecedor X" />
          <button type="submit" id="entry-submit"><svg class="icon"><use href="#i-arrow-down-to-line" /></svg>Registrar entrada</button>
          <p id="entry-msg" class="error" hidden></p>
        </form>

        <form id="adjustment-form" class="card reveal" data-tone="danger" novalidate>
          <div class="card-head">
            <span class="card-icon"><svg class="icon"><use href="#i-package-x" /></svg></span>
            <div><h3>Perda ou ajuste</h3><p class="muted">Vencido, quebrado, consumo interno</p></div>
          </div>
          <label for="adjustment-product">Produto</label>
          <select id="adjustment-product" required></select>
          <div class="stock-hint" id="adjustment-hint"></div>
          <label for="adjustment-qty">Quantidade a remover</label><input id="adjustment-qty" type="number" step="0.001" min="0.001" required />
          <label for="adjustment-reason">Motivo</label><input id="adjustment-reason" maxlength="255" required placeholder="Ex: produto vencido" />
          <button type="submit" id="adjustment-submit"><svg class="icon"><use href="#i-arrow-up-from-line" /></svg>Registrar perda</button>
          <p id="adjustment-msg" class="error" hidden></p>
        </form>
      </div>

      <div class="card reveal">
        <div class="card-head">
          <span class="card-icon"><svg class="icon"><use href="#i-clock" /></svg></span>
          <div><h3>Histórico de movimentações</h3><p class="muted">Toda mudança de estoque, com saldo anterior e novo</p></div>
          <span class="card-actions">
            <a class="btn" id="movements-export" href="/api/stock/movements/export?format=xlsx" download><svg class="icon"><use href="#i-download" /></svg>Planilha</a>
          </span>
        </div>
        <div class="toolbar">
          <div class="segmented" id="movement-filter" role="group" aria-label="Filtrar por tipo">
            <button type="button" class="active" data-type="">Todas</button>
            <button type="button" data-type="ENTRY">Entradas</button>
            <button type="button" data-type="SALE">Vendas</button>
            <button type="button" data-type="LOSS">Perdas</button>
            <button type="button" data-type="ADJUSTMENT">Ajustes</button>
          </div>
        </div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Qtd</th><th>Saldo</th><th>Motivo</th><th>Usuário</th></tr></thead>
          <tbody id="movements-list"></tbody>
        </table></div>
        <div id="movements-pager" class="pager" hidden></div>
      </div>
    </section>
  </template>

  <template id="tpl-receipt">
    <div class="card receipt-card" id="receipt-card">
      <div class="receipt-hero">
        <svg class="success-check" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26" /><path d="M17 29l7 7 15-16" /></svg>
        <h3>Venda confirmada</h3>
        <p class="muted" id="receipt-meta"></p>
      </div>
      <div class="table-wrap"><table class="table">
        <thead><tr><th>Produto</th><th>Qtd</th><th>Preço</th><th>Subtotal</th></tr></thead>
        <tbody id="receipt-items"></tbody>
      </table></div>
      <div class="receipt-total"><span>Total</span><strong id="receipt-total">R$ 0,00</strong></div>
      <div class="form-actions no-print">
        <button type="button" id="receipt-close-btn"><svg class="icon"><use href="#i-plus" /></svg>Nova venda</button>
        <button type="button" id="receipt-print-btn" class="secondary"><svg class="icon"><use href="#i-printer" /></svg>Imprimir</button>
      </div>
    </div>
  </template>

  <template id="tpl-importar">
    <section>
      <div class="steps" id="imp-steps" aria-label="Etapas da importação">
        <div class="step" data-step="source"><span class="step-dot"><span>1</span><svg class="icon"><use href="#i-check" /></svg></span><span class="step-label">Planilha</span></div>
        <div class="step-line"><span></span></div>
        <div class="step" data-step="mapping"><span class="step-dot"><span>2</span><svg class="icon"><use href="#i-check" /></svg></span><span class="step-label">Colunas</span></div>
        <div class="step-line"><span></span></div>
        <div class="step" data-step="preview"><span class="step-dot"><span>3</span><svg class="icon"><use href="#i-check" /></svg></span><span class="step-label">Conferência</span></div>
        <div class="step-line"><span></span></div>
        <div class="step" data-step="result"><span class="step-dot"><span>4</span><svg class="icon"><use href="#i-check" /></svg></span><span class="step-label">Concluído</span></div>
      </div>

      <div class="card step-card" id="imp-step-source">
        <div class="card-head">
          <span class="card-icon"><svg class="icon"><use href="#i-file-up" /></svg></span>
          <div><h3>Escolha a planilha</h3><p class="muted">Excel (.xlsx), CSV ou texto separado por ponto e vírgula, vírgula ou tabulação</p></div>
          <span class="card-actions"><a class="btn" href="/api/imports/products/template" download><svg class="icon"><use href="#i-download" /></svg>Baixar modelo</a></span>
        </div>

        <label class="dropzone" id="imp-dropzone" for="imp-file">
          <span class="dz-icon"><svg class="icon"><use href="#i-file-up" /></svg></span>
          <strong id="imp-file-name">Arraste a planilha para cá</strong>
          <small id="imp-file-hint">ou clique para escolher o arquivo</small>
          <input id="imp-file" type="file" accept=".xlsx,.xlsm,.csv,.txt,.tsv" />
        </label>

        <div class="divider-or">ou</div>
        <label for="imp-paste">Cole os dados copiados do Excel / Google Planilhas</label>
        <textarea id="imp-paste" rows="4" placeholder="Cole aqui, incluindo a linha de cabeçalho"></textarea>
        <p class="muted">As colunas são reconhecidas pelo cabeçalho (EAN, VLR VENDA, QTDE, VENCIMENTO…). No passo seguinte você confere e ajusta.</p>

        <div class="form-actions">
          <button type="button" id="imp-read-btn">Ler planilha<svg class="icon"><use href="#i-arrow-right" /></svg></button>
        </div>
        <p id="imp-source-msg" class="error" hidden></p>
      </div>

      <div class="card step-card" id="imp-step-mapping" hidden>
        <div class="card-head">
          <span class="card-icon"><svg class="icon"><use href="#i-chart-column" /></svg></span>
          <div><h3>Confira as colunas</h3><p class="muted" id="imp-grid-info"></p></div>
        </div>
        <div class="map-grid" id="imp-map-grid"></div>

        <h3 class="spaced">Como aplicar</h3>
        <div class="grid-3">
          <div>
            <label for="imp-mode">Produtos</label>
            <select id="imp-mode">
              <option value="upsert">Cadastrar novos e atualizar existentes</option>
              <option value="createOnly">Somente cadastrar novos</option>
              <option value="updateOnly">Somente atualizar existentes</option>
            </select>
          </div>
          <div>
            <label for="imp-match-by">Identificar o produto por</label>
            <select id="imp-match-by">
              <option value="barcode">Código de barras (e nome, quando faltar)</option>
              <option value="name">Nome do produto</option>
            </select>
          </div>
          <div>
            <label for="imp-stock-mode">Coluna de estoque</label>
            <select id="imp-stock-mode">
              <option value="ignore">Só no cadastro de produtos novos</option>
              <option value="set">Substituir o saldo atual (balanço)</option>
              <option value="add">Somar ao saldo atual (entrada de mercadoria)</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" id="imp-back-btn" class="secondary"><svg class="icon"><use href="#i-chevron-left" /></svg>Trocar planilha</button>
          <button type="button" id="imp-preview-btn">Conferir antes de gravar<svg class="icon"><use href="#i-arrow-right" /></svg></button>
        </div>
        <p id="imp-map-msg" class="error" hidden></p>
      </div>

      <div class="card step-card" id="imp-step-preview" hidden>
        <div class="card-head">
          <span class="card-icon"><svg class="icon"><use href="#i-eye" /></svg></span>
          <div><h3>Confira o que será gravado</h3><p class="muted">Nada foi gravado ainda.</p></div>
        </div>
        <div class="stat-cards" id="imp-summary"></div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Linha</th><th>Ação</th><th>Produto</th><th>Preço de venda</th><th>Estoque</th><th>Observações</th></tr></thead>
          <tbody id="imp-preview-body"></tbody>
        </table></div>
        <div class="form-actions">
          <button type="button" id="imp-adjust-btn" class="secondary"><svg class="icon"><use href="#i-chevron-left" /></svg>Voltar e ajustar</button>
          <button type="button" id="imp-commit-btn"><svg class="icon"><use href="#i-check" /></svg>Confirmar importação</button>
        </div>
        <p id="imp-preview-msg" class="error" hidden></p>
      </div>

      <div class="card step-card" id="imp-step-result" hidden>
        <div class="receipt-hero">
          <svg class="success-check" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26" /><path d="M17 29l7 7 15-16" /></svg>
          <h3>Importação concluída</h3>
          <p class="muted" id="imp-result-text"></p>
        </div>
        <div id="imp-failures" hidden>
          <h3 class="spaced">Linhas que não puderam ser gravadas</h3>
          <div class="table-wrap"><table class="table">
            <thead><tr><th>Linha</th><th>Produto</th><th>Motivo</th></tr></thead>
            <tbody id="imp-failures-body"></tbody>
          </table></div>
        </div>
        <div class="form-actions">
          <button type="button" id="imp-restart-btn"><svg class="icon"><use href="#i-file-up" /></svg>Importar outra planilha</button>
        </div>
      </div>
    </section>
  </template>

  <template id="tpl-relatorios">
    <section>
      <div class="card reveal">
        <div class="filter-bar">
          <div>
            <label>Período</label>
            <div class="segmented" id="rep-presets" role="group" aria-label="Período rápido">
              <button type="button" data-preset="today">Hoje</button>
              <button type="button" data-preset="7">7 dias</button>
              <button type="button" class="active" data-preset="30">30 dias</button>
              <button type="button" data-preset="month">Este mês</button>
              <button type="button" data-preset="all">Tudo</button>
            </div>
          </div>
          <div class="date-range">
            <div><label for="rep-from">De</label><input id="rep-from" type="date" /></div>
            <div><label for="rep-to">Até</label><input id="rep-to" type="date" /></div>
            <button id="rep-apply-btn" type="button" class="secondary">Aplicar</button>
          </div>
        </div>
      </div>

      <div class="kpi-grid" id="rep-kpis"></div>

      <div class="card reveal">
        <div class="card-head">
          <span class="card-icon"><svg class="icon"><use href="#i-trending-up" /></svg></span>
          <div><h3>Vendas por dia</h3><p class="muted" id="rep-chart-caption"></p></div>
          <span class="card-actions">
            <a class="btn" id="rep-export-summary" href="#" download><svg class="icon"><use href="#i-download" /></svg>Planilha</a>
          </span>
        </div>
        <div id="rep-chart" class="chart"><div class="skeleton skeleton-block"></div></div>
      </div>

      <div class="grid-2">
        <div class="card reveal">
          <div class="card-head" data-tone="warn">
            <span class="card-icon"><svg class="icon"><use href="#i-sparkles" /></svg></span>
            <div><h3>Mais vendidos</h3><p class="muted">Por receita no período</p></div>
            <span class="card-actions">
              <a class="btn" id="rep-export-top" href="#" download><svg class="icon"><use href="#i-download" /></svg>Planilha</a>
            </span>
          </div>
          <div class="table-wrap"><table class="table rank-table"><thead><tr><th></th><th>Produto</th><th>Qtd</th><th>Receita</th></tr></thead><tbody id="rep-top-products"></tbody></table></div>
        </div>
        <div class="card reveal">
          <div class="card-head" data-tone="info">
            <span class="card-icon"><svg class="icon"><use href="#i-calendar" /></svg></span>
            <div><h3>Resumo por dia</h3><p class="muted"><span id="rep-count">0</span> venda(s) · <strong id="rep-total">R$ 0,00</strong></p></div>
          </div>
          <div class="table-wrap"><table class="table"><thead><tr><th>Dia</th><th>Total</th></tr></thead><tbody id="rep-by-day"></tbody></table></div>
        </div>
      </div>

      <div class="card reveal" data-tone="danger">
        <div class="card-head">
          <span class="card-icon"><svg class="icon"><use href="#i-package-x" /></svg></span>
          <div><h3>Capital parado em estoque</h3><p class="muted">Produtos sem venda nos últimos 60 dias</p></div>
          <span class="chip" id="rep-slow-total">—</span>
          <span class="card-actions">
            <a class="btn" href="/api/reports/slow-moving/export?format=xlsx" download><svg class="icon"><use href="#i-download" /></svg>Planilha</a>
          </span>
        </div>
        <div class="table-wrap"><table class="table"><thead><tr><th>Produto</th><th>Estoque</th><th>Capital parado</th></tr></thead><tbody id="rep-slow-moving"></tbody></table></div>
      </div>
    </section>
  </template>

  <template id="tpl-usuarios">
    <section>
      <div class="toolbar">
        <p class="muted">Quem pode entrar no sistema e o que cada pessoa pode fazer. Todos podem vender.</p>
        <button id="new-user-btn" class="push-right" type="button"><svg class="icon"><use href="#i-user-plus" /></svg>Novo usuário</button>
      </div>
      <div class="card reveal">
        <div class="card-head">
          <span class="card-icon"><svg class="icon"><use href="#i-users" /></svg></span>
          <div><h3>Contas</h3><p class="muted" id="users-caption">Carregando…</p></div>
        </div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Nome</th><th>Usuário</th><th>E-mail</th><th>Perfil</th><th>Situação</th><th></th></tr></thead>
          <tbody id="users-list"></tbody>
        </table></div>
      </div>
    </section>
  </template>

  <template id="tpl-user-form">
    <form id="user-form" class="card" novalidate>
      <div class="modal-head">
        <span class="card-icon"><svg class="icon"><use href="#i-user" /></svg></span>
        <div><h3 id="user-form-title">Novo usuário</h3><p class="muted" id="user-form-sub">Escolha o tipo de pessoa e ajuste as permissões.</p></div>
        <button type="button" class="icon-btn modal-close" id="user-close-btn" aria-label="Fechar"><svg class="icon"><use href="#i-x" /></svg></button>
      </div>
      <input type="hidden" id="u-id" />
      <label for="u-name">Nome</label>
      <div class="field"><svg class="icon"><use href="#i-user" /></svg><input id="u-name" required maxlength="120" placeholder="Nome completo" /></div>
      <div id="u-email-field">
        <label id="u-email-label" for="u-email">E-mail</label>
        <div class="field"><svg class="icon"><use href="#i-mail" /></svg><input id="u-email" type="email" required maxlength="255" placeholder="pessoa@email.com" /></div>
      </div>
      <label id="u-password-label" for="u-password">Senha</label>
      <div class="field">
        <svg class="icon"><use href="#i-key-round" /></svg>
        <input id="u-password" type="password" minlength="8" maxlength="200" autocomplete="new-password" placeholder="Mínimo de 8 caracteres" />
        <button type="button" class="field-action" id="u-password-toggle" aria-label="Mostrar senha" aria-pressed="false">
          <svg class="icon icon-main"><use href="#i-eye" /></svg><svg class="icon icon-alt"><use href="#i-eye-off" /></svg>
        </button>
      </div>
      <div class="strength" id="u-strength" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <span class="strength-label" id="u-strength-label"></span>
      <div id="u-perms-block">
        <label>Tipo de pessoa</label>
        <div class="segmented" id="u-template" role="group" aria-label="Tipo de pessoa"></div>
        <fieldset class="perm-list" id="u-perms"><legend class="hint">Pode fazer (além de vender):</legend></fieldset>
      </div>
      <label class="switch" id="u-active-label" for="u-active"><input id="u-active" type="checkbox" checked />Conta ativa (pode entrar no sistema)</label>
      <p id="user-form-msg" class="error" hidden></p>
      <div class="form-actions">
        <button type="submit" id="user-save-btn"><svg class="icon"><use href="#i-check" /></svg>Salvar</button>
        <button type="button" id="user-cancel-btn" class="secondary">Cancelar</button>
      </div>
    </form>
  </template>

  <script src="/js/api.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
